<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reporter Flipbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fb; color: #111; }
    main { max-width: 860px; margin: 0 auto; padding: 2rem; }
    h1 { margin-top: 0; }
    a { color: #1d4ed8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cards { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .card { border: 1px solid #d1d5db; border-radius: 1rem; padding: 1.25rem; background: #fff; }
    .card h2 { margin: 0 0 0.5rem; }
    .card p { margin: 0.5rem 0 0; color: #4b5563; }
  </style>
</head>
<body>
<main>
  <h1>Reporter Flipbook</h1>
  <p>Welcome to the new content structure. Use the links below to open a Reporter issue or a brochure page.</p>
  <div class="cards">
    <div class="card">
      <h2>Reporter archive</h2>
      <p><a href="reporter/">Browse issues by year and month</a>.</p>
    </div>
  </div>
</main>
</body>
</html>
